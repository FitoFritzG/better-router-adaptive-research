name: research-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests — configuration and data
        run: >-
          python -m pytest -q
          tests/unit/test_config.py
          tests/unit/test_schema.py
          tests/unit/test_data_pipeline.py
          tests/unit/test_data_pipeline_edges.py
      - name: Unit tests — routing and evaluation
        if: always()
        run: >-
          python -m pytest -q
          tests/unit/test_features.py
          tests/unit/test_split.py
          tests/unit/test_utility.py
          tests/unit/test_policies.py
          tests/unit/test_bootstrap.py
          tests/unit/test_routers.py
      - name: Integration — Step 3
        if: always()
        run: python -m pytest -q tests/integration/test_step3_pipeline.py --tb=short
      - name: Integration — Step 4
        if: always()
        run: python -m pytest -q tests/integration/test_step4_prepare.py --tb=short
      - name: Integration — Step 5
        if: always()
        run: python -m pytest -q tests/integration/test_step5_baselines.py --tb=short
      - name: Integration — Step 6
        if: always()
        run: python -m pytest -q tests/integration/test_step6_learn.py --tb=short
      - name: Integration — Step 7
        if: always()
        run: python -m pytest -q tests/integration/test_step7_evaluate.py --tb=short
      - name: Full coverage gate
        if: always()
        run: >-
          python -m pytest -q
          --cov=better_router_adaptive
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=85
      - name: Ruff lint
        if: always()
        run: ruff check .
      - name: Ruff format — source
        if: always()
        run: ruff format --check src
      - name: Ruff format — tests
        if: always()
        run: ruff format --check tests
      - name: Ruff format — scripts
        if: always()
        run: ruff format --check scripts
      - name: Ruff format — paper
        if: always()
        run: ruff format --check paper
      - name: Ruff format — complete repository
        if: always()
        run: ruff format --check .
      - name: Strict typing — mandatory submission
        if: always()
        run: mypy src tests --exclude '^tests/app/'
      - name: Build package
        if: always()
        run: python -m build
      - name: Professor submission structure
        if: always()
        run: python scripts/verify_professor_submission.py
      - name: CLI smoke tests
        if: always()
        run: |
          python -m better_router_adaptive.data.download --help
          python -m better_router_adaptive.data.convert --help
          python -m better_router_adaptive.data.pipeline --help
          python -m better_router_adaptive.prepare --help
          python -m better_router_adaptive.baselines --help
          python -m better_router_adaptive.learn --help
          python -m better_router_adaptive.evaluate --help

  bonus-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet -e ".[dev,app]"
      - name: Public result loading tests
        run: python -m pytest -q tests/app/test_data_access.py --tb=short
      - name: Synthetic simulator tests
        run: python -m pytest -q tests/app/test_simulator.py --tb=short
      - name: Streamlit smoke test
        run: python -m pytest -q tests/app/test_streamlit_app.py --tb=short
      - name: Streamlit bonus lint
        run: ruff check app tests/app
      - name: Streamlit bonus format
        run: ruff format --check app tests/app
      - name: Streamlit bonus typing
        run: mypy src tests app
