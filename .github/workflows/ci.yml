name: research-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Configuration and acquisition tests
        run: python -m pytest -q tests/unit/test_config.py tests/unit/test_schema.py
      - name: Canonical pipeline unit tests
        if: always()
        run: python -m pytest -q tests/unit/test_data_pipeline.py tests/unit/test_data_pipeline_edges.py
      - name: Step 3 integration test
        if: always()
        run: python -m pytest -q tests/integration/test_step3_pipeline.py
      - name: Full coverage gate
        if: always()
        run: >-
          python -m pytest -q
          --cov=better_router_adaptive
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=85
      - name: Ruff lint
        if: always()
        run: ruff check .
      - name: Ruff format
        if: always()
        run: ruff format --check .
      - name: Strict typing
        if: always()
        run: mypy src tests
      - name: Build package
        if: always()
        run: python -m build
      - name: CLI smoke tests
        if: always()
        run: |
          python -m better_router_adaptive.data.convert --help
          python -m better_router_adaptive.data.pipeline --help
