name: finalize-academic-delivery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-delivery.yml"
      - "paper/poster/build_final_poster.py"
      - "scripts/verify_submission.py"
      - "ENTREGA.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "weasyprint==68.0"
      - name: Verify complete research project
        run: |
          python -m pytest -q \
            --cov=better_router_adaptive \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=85
          ruff check .
          ruff format --check src tests paper
          mypy src tests
          python -m build
      - name: Generate final scientific poster
        run: |
          python paper/poster/build_final_poster.py
          weasyprint \
            paper/poster/poster_evocascade_ideal.html \
            paper/poster/poster_evocascade_ideal.pdf
          test "$(head -c 5 paper/poster/poster_evocascade_ideal.pdf)" = "%PDF-"
          test "$(stat -c %s paper/poster/poster_evocascade_ideal.pdf)" -gt 10000
      - name: Verify required academic deliverables
        run: python scripts/verify_submission.py --root .
      - name: Build clean academic ZIP
        run: |
          set -euo pipefail
          PACKAGE_ROOT="/tmp/Better_Router_Adaptive_Entrega"
          rm -rf "$PACKAGE_ROOT" delivery
          mkdir -p \
            "$PACKAGE_ROOT/artifacts" \
            "$PACKAGE_ROOT/paper/poster" \
            "$PACKAGE_ROOT/scripts" \
            delivery

          cp -R src "$PACKAGE_ROOT/"
          cp -R config "$PACKAGE_ROOT/"
          cp -R artifacts/public "$PACKAGE_ROOT/artifacts/"
          cp -R docs "$PACKAGE_ROOT/"
          cp references.bib "$PACKAGE_ROOT/"
          cp -R tests "$PACKAGE_ROOT/"
          cp scripts/verify_submission.py "$PACKAGE_ROOT/scripts/"
          cp paper/poster/build_final_poster.py "$PACKAGE_ROOT/paper/poster/"
          cp paper/poster/poster_evocascade_ideal.html "$PACKAGE_ROOT/paper/poster/"
          cp paper/poster/poster_evocascade_ideal.pdf \
            "$PACKAGE_ROOT/paper/poster/poster_evocascade_ideal.pdf"
          cp \
            README.md ENTREGA.md AUTHORS.md CITATION.cff LICENSE LICENSES.md \
            Makefile pyproject.toml requirements.txt \
            "$PACKAGE_ROOT/"

          find "$PACKAGE_ROOT" -type d \
            \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache \) \
            -prune -exec rm -rf {} +
          find "$PACKAGE_ROOT" -type f \
            \( -name '*.pyc' -o -name '*.pkl' -o -name '*.pickle' -o -name '.env*' \) \
            -delete

          python "$PACKAGE_ROOT/scripts/verify_submission.py" \
            --root "$PACKAGE_ROOT" \
            --poster "$PACKAGE_ROOT/paper/poster/poster_evocascade_ideal.pdf"

          (cd /tmp && zip -qr \
            "$GITHUB_WORKSPACE/delivery/Better_Router_Adaptive_Entrega_Final.zip" \
            Better_Router_Adaptive_Entrega)
          sha256sum \
            delivery/Better_Router_Adaptive_Entrega_Final.zip \
            paper/poster/poster_evocascade_ideal.pdf \
            > delivery/SHA256SUMS.txt
          unzip -t delivery/Better_Router_Adaptive_Entrega_Final.zip
      - name: Commit generated delivery files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper/poster/poster_evocascade_ideal.html \
            paper/poster/poster_evocascade_ideal.pdf \
            delivery/Better_Router_Adaptive_Entrega_Final.zip \
            delivery/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Generated delivery files are already current."
          else
            git commit -m "release: publish final academic delivery [skip ci]"
            git push origin HEAD:main
          fi
      - name: Remove all remote branches except main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' | while IFS= read -r branch; do
              if [ "$branch" != "main" ]; then
                echo "Deleting branch: $branch"
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              fi
            done
          echo "Remaining branches:"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name'
      - uses: actions/upload-artifact@v4
        with:
          name: Better_Router_Adaptive_Entrega_Final
          path: |
            delivery/Better_Router_Adaptive_Entrega_Final.zip
            delivery/SHA256SUMS.txt
            paper/poster/poster_evocascade_ideal.pdf
          if-no-files-found: error
