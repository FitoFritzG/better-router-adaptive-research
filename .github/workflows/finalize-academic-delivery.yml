name: finalize-academic-delivery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-academic-delivery.yml"
      - "ENTREGA.md"
      - "EVALUACION_PROFESOR.md"
      - "paper/poster/build_poster.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and poster renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "weasyprint==68.0"
      - name: Run professor evaluation gate
        run: make professor-check
      - name: Generate and validate scientific poster PDF
        run: |
          python paper/poster/build_poster.py
          weasyprint paper/poster/poster.html paper/poster/poster_better_router.pdf
          test "$(head -c 5 paper/poster/poster_better_router.pdf)" = "%PDF-"
          test "$(stat -c %s paper/poster/poster_better_router.pdf)" -gt 10000
      - name: Build clean final submission ZIP
        run: |
          set -euo pipefail
          PACKAGE_ROOT="/tmp/Better_Router_Adaptive_Entrega"
          rm -rf "$PACKAGE_ROOT" delivery
          mkdir -p \
            "$PACKAGE_ROOT/artifacts" \
            "$PACKAGE_ROOT/paper/poster" \
            "$PACKAGE_ROOT/scripts" \
            "$PACKAGE_ROOT/data" \
            delivery

          cp -R src config tests docs "$PACKAGE_ROOT/"
          cp -R artifacts/public "$PACKAGE_ROOT/artifacts/"
          cp data/README.md "$PACKAGE_ROOT/data/"
          cp scripts/verify_professor_submission.py "$PACKAGE_ROOT/scripts/"
          cp paper/poster/build_poster.py "$PACKAGE_ROOT/paper/poster/"
          cp paper/poster/poster.html "$PACKAGE_ROOT/paper/poster/"
          cp paper/poster/poster_better_router.pdf "$PACKAGE_ROOT/paper/poster/"
          cp \
            README.md ENTREGA.md EVALUACION_PROFESOR.md AUTHORS.md CITATION.cff \
            LICENSE LICENSES.md LATEST_STUDY.md Makefile pyproject.toml \
            requirements.txt references.bib \
            "$PACKAGE_ROOT/"

          find "$PACKAGE_ROOT" -type d \
            \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache \) \
            -prune -exec rm -rf {} +
          find "$PACKAGE_ROOT" -type f \
            \( -name '*.pyc' -o -name '*.pkl' -o -name '*.pickle' -o -name '.env*' \
               -o -name '*.key' -o -name '*.pem' \) \
            -delete

          PACKAGE_ROOT="$PACKAGE_ROOT" python - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["PACKAGE_ROOT"])
          required = (
              "paper/poster/poster_better_router.pdf",
              "src/better_router_adaptive/routers.py",
              "src/better_router_adaptive/data/pipeline.py",
              "config/experiment.yaml",
              "config/models.yaml",
              "tests/unit/test_routers.py",
              "tests/integration/test_step7_evaluate.py",
              "docs/METHODOLOGY.md",
              "docs/RESULTS.md",
              "artifacts/public/step7-real/evaluation_summary.csv",
              "README.md",
              "ENTREGA.md",
              "EVALUACION_PROFESOR.md",
              "pyproject.toml",
              "requirements.txt",
          )
          missing = [path for path in required if not (root / path).is_file()]
          poster = root / "paper/poster/poster_better_router.pdf"
          pdf_ok = poster.is_file() and poster.stat().st_size > 10_000
          if pdf_ok:
              pdf_ok = poster.read_bytes()[:5] == b"%PDF-"
          forbidden = [
              str(path.relative_to(root))
              for path in root.rglob("*")
              if path.is_file()
              and (
                  path.suffix.lower() in {".pkl", ".pickle", ".key", ".pem"}
                  or path.name.startswith(".env")
              )
          ]
          if missing or forbidden or not pdf_ok:
              raise SystemExit(
                  f"invalid final package: missing={missing}, forbidden={forbidden}, pdf_ok={pdf_ok}"
              )
          print(f"[PASS] Final package verified: {len(list(root.rglob('*')))} entries")
          PY

          (cd /tmp && zip -qr \
            "$GITHUB_WORKSPACE/delivery/Better_Router_Adaptive_Entrega_Final.zip" \
            Better_Router_Adaptive_Entrega)
          sha256sum \
            delivery/Better_Router_Adaptive_Entrega_Final.zip \
            paper/poster/poster_better_router.pdf \
            > delivery/SHA256SUMS.txt
          unzip -t delivery/Better_Router_Adaptive_Entrega_Final.zip
      - name: Commit final delivery assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper/poster/poster.html \
            paper/poster/poster_better_router.pdf \
            delivery/Better_Router_Adaptive_Entrega_Final.zip \
            delivery/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Final delivery assets are already current."
          else
            git commit -m "release: publish final academic delivery [skip ci]"
            git push origin HEAD:main
          fi
      - name: Delete every remote branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.parse

          repository = os.environ["GITHUB_REPOSITORY"]
          response = subprocess.check_output(
              ["gh", "api", "--paginate", f"repos/{repository}/branches?per_page=100"],
              text=True,
          )
          branches = [item["name"] for item in json.loads(response)]
          deleted = []
          for branch in branches:
              if branch == "main":
                  continue
              encoded = urllib.parse.quote(branch, safe="")
              subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "DELETE",
                      f"repos/{repository}/git/refs/heads/{encoded}",
                  ],
                  check=True,
              )
              deleted.append(branch)
          print("Deleted branches:", deleted)
          remaining = subprocess.check_output(
              ["gh", "api", "--paginate", f"repos/{repository}/branches?per_page=100", "--jq", ".[].name"],
              text=True,
          )
          print("Remaining branches:", remaining.strip())
          if remaining.strip() != "main":
              raise SystemExit(f"unexpected remaining branches: {remaining!r}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Better_Router_Adaptive_Entrega_Final
          path: |
            delivery/Better_Router_Adaptive_Entrega_Final.zip
            delivery/SHA256SUMS.txt
            paper/poster/poster_better_router.pdf
          if-no-files-found: error
