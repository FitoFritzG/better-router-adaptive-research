[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "better-router-adaptive"
version = "0.3.0"
description = "Reproducible research on quality-cost-latency-aware multi-LLM routing."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Rodolfo Fritz" },
  { name = "Benjamín Cerda" },
  { name = "Felipe Friz" },
]
keywords = ["llm-routing", "contextual-bandit", "xgboost", "cascades", "cma-es", "research", "better-router"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "xgboost==3.3.0",
  "matplotlib>=3.9,<4",
  "joblib>=1.4,<2",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
app = ["streamlit>=1.37,<2"]
dev = [
  "hatchling>=1.25,<2",
  "build==1.5.1",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.10",
  "types-PyYAML==6.0.12.20250915",
  "pandas-stubs==2.2.3.250527",
]

[tool.hatch.build.targets.wheel]
packages = ["src/better_router_adaptive"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/config",
  "/docs",
  "/paper",
  "/artifacts/examples",
  "/artifacts/public",
  "/README.md",
  "/LATEST_STUDY.md",
  "/AUTHORS.md",
  "/CITATION.cff",
  "/LICENSE",
  "/LICENSES.md",
  "/Makefile",
  "/requirements.txt",
  "/ENTREGA.md",
  "/EVALUACION_PROFESOR.md",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
