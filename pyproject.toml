[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "better-router-adaptive"
version = "0.1.0"
description = "Reproducible research on quality-cost-latency-aware multi-LLM routing."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Rodolfo Eduardo Fritz Gutiérrez" }
]
keywords = ["llm-routing", "contextual-bandit", "xgboost", "research", "better-router"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "xgboost>=2.1,<4",
  "matplotlib>=3.9,<4",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
app = ["streamlit>=1.37,<2"]
dev = [
  "hatchling>=1.25,<2",
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12",
  "pandas-stubs>=2.2.3.250527,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/better_router_adaptive"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
